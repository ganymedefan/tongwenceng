<script type="importmap">{ "imports": {

<style>
@font-face { font-family: "TWC Sans"; src: url("./fonts/noto-sans-sc-vf.woff2") format("woff2-variations"); font-weight: 100 900; font-display: swap; }
@font-face { font-family: "Exposure"; src: url("./fonts/Exposure-m20.otf") format("opentype"); font-display: swap; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; background: #EB83B0; }
body { font-family: "TWC Sans", "PingFang SC", sans-serif; color: #16121a; -webkit-font-smoothing: antialiased; }
canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }

/* 读数：压在画面左下，很少的字 */
.read { position: fixed; left: clamp(16px, 3vw, 44px); bottom: clamp(16px, 3.4vh, 40px); z-index: 2; pointer-events: none; }
#ov { z-index: 1; pointer-events: none; }
.read .n { font-family: "Exposure", serif; font-size: clamp(72px, 11vw, 190px); line-height: .82; letter-spacing: -.03em; }
.read .n small { font-size: .32em; letter-spacing: 0; margin-left: .12em; }
.read .t { margin-top: 14px; font-size: 13px; line-height: 1.7; letter-spacing: .06em; font-weight: 500; }

/* 换一位受访者（右下，很小） */
.who { position: fixed; right: clamp(16px, 3vw, 44px); bottom: clamp(16px, 3.4vh, 40px); z-index: 2; display: flex; gap: 14px; align-items: baseline;
  font-family: "Exposure", serif; font-size: 18px; letter-spacing: .01em; mix-blend-mode: multiply; }
.who button { all: unset; cursor: pointer; font-size: 18px; padding: 4px 2px; opacity: .7; }
.who button:hover { opacity: 1; }
.who small { font-family: "TWC Sans", sans-serif; font-size: 11px; letter-spacing: .1em; margin-left: 8px; }
.cam { position: fixed; right: clamp(16px, 3vw, 44px); top: clamp(16px, 3.4vh, 40px); z-index: 2; font-size: 12px; letter-spacing: .06em;
  background: none; border: 0; border-bottom: 1px solid currentColor; color: #16121a; cursor: pointer; font-family: inherit; padding: 2px 0; }
.note { position: fixed; left: clamp(16px, 3vw, 44px); top: clamp(16px, 3.4vh, 40px); z-index: 2; font-size: 12px; letter-spacing: .06em; opacity: .7; }
/* 没答完：上锁 */
.lock { position: fixed; inset: 0; z-index: 5; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 24px; }
.lock.on { display: flex; }
.lock em { font-style: normal; font-size: 13px; letter-spacing: .08em; color: rgba(27,24,29,.55); margin-bottom: 18px; }
.lang-zh .lock em { font-family: var(--zh); font-weight: 330; letter-spacing: .16em; }
.lock p { font-family: "Exposure", Georgia, serif; font-size: clamp(26px, 3vw, 44px); line-height: 1.25; color: #1b181d; max-width: 16em; }
.lock small { display: block; margin-top: 14px; font-size: 13px; color: rgba(27,24,29,.6); letter-spacing: .04em; }
.lock a { display: inline-block; margin-top: 30px; font-size: 15px; padding: 12px 22px; border-radius: 999px; background: #1b181d; color: #fff; text-decoration: none; cursor: pointer; }
.lock a.try { background: none; color: #1b181d; padding: 0; margin-top: 18px; font-size: 13.5px; border-bottom: 1px solid currentColor; border-radius: 0; opacity: .7; }
.lock a.try:hover { opacity: 1; }
.lang-zh .lock p { font-family: var(--zh); font-weight: 330; letter-spacing: .06em; line-height: 1.6; max-width: 22em; }
.lang-zh .lock small, .lang-zh .lock a { font-family: var(--zh); font-weight: 330; letter-spacing: .1em; }
/* 答完以后：回顾 · 重新答题 */
.mine { position: fixed; right: clamp(16px, 3vw, 44px); bottom: clamp(16px, 3.4vh, 40px); z-index: 4; display: none; gap: 10px; font-size: 13px; color: #1b181d; mix-blend-mode: multiply; }
.mine.on { display: flex; }
.mine a { cursor: pointer; border-bottom: 1px solid currentColor; }
.lang-zh .mine { font-family: var(--zh); font-weight: 330; letter-spacing: .08em; }
.review { position: fixed; inset: 0; z-index: 6; background: rgba(255,255,255,.96); display: none; overflow: auto; }
.review.on { display: block; }
.review .rin { max-width: 760px; margin: 0 auto; padding: clamp(40px, 9vh, 100px) 24px 80px; }
.review header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 36px; }
.review h2 { font-family: "Exposure", Georgia, serif; font-weight: 400; font-size: clamp(28px, 3vw, 44px); }
.review #rvx { font-size: 28px; cursor: pointer; color: #1b181d; text-decoration: none; }
.review ol { list-style: none; }
.review li { border-top: 1px solid #ebe8ea; padding: 18px 0; display: grid; grid-template-columns: 9em 1fr auto; gap: 18px; align-items: baseline; cursor: pointer; }
.review ol { position: relative; }
.review li { position: relative; z-index: 1; }
/* 九行底下是同一片弥散：每一行在自己那条里晕开那一台的颜色，分数越高越浓、越开；九团连成一片一起慢慢呼吸 */
#rvf { position: absolute; left: -24px; right: -24px; top: -20px; bottom: -20px; width: calc(100% + 48px); height: calc(100% + 40px); z-index: 0; pointer-events: none; filter: blur(14px) saturate(1.05); opacity: .9; }
.review li .k { font-size: 13px; color: rgba(27,24,29,.55); }
.review li .a { font-size: 16px; line-height: 1.55; color: #1b181d; }
.review li .a small { display: block; font-size: 13px; color: rgba(27,24,29,.55); margin-top: 4px; }
.review li .g { font-size: 13px; color: rgba(27,24,29,.55); white-space: nowrap; }
.lang-zh .review { font-family: var(--zh); }
.lang-zh .review h2 { font-family: var(--zh); font-weight: 330; letter-spacing: .06em; }
.lang-zh .review li .a { font-weight: 250; letter-spacing: .05em; line-height: 1.9; }
.lang-zh .review li .k, .lang-zh .review li .g { font-weight: 330; letter-spacing: .06em; }
@media (max-width: 700px) { .review li { grid-template-columns: 1fr; gap: 6px; } }

<canvas id="c"></canvas>
<canvas id="ov"></canvas>
<div class="read"><div class="n" id="num"></div></div>
<div class="lock" id="lock"><em id="lk0"></em><p id="lk1"></p><small id="lk2"></small><a id="lk3"></a><a id="lk4" class="try"></a></div>
<nav class="mine" id="mineNav"><a id="rv"></a><span>·</span><a id="redo"></a></nav>
<div class="review" id="review"><div class="rin"><header><h2 id="rvh"></h2><a id="rvx">×</a></header><ol id="rvl"></ol></div></div>


<script type="module">
/*
  热像镜子：答完九题以后，用摄像头照自己，画面按"自己的综合数据"变成热像。
  参考：OpenProcessing · davepagurek（摄像头 → 模糊 → 按亮度映射到几个颜色），
        Brik · Thermal Camera（Rotem Batito：大晕染、颗粒、动的地方更亮）。
  颜色和热度不是自己定的，直接照 20.2 映射工具（score-mapping.js，11-22 版）：
    综合分 = 9 题平均；<4/3 用后台色卡，4/3–8/3 中台色卡，>8/3 前台色卡（硬分界）
    前台/中台：t = clip(0.10 + p^1.15 × 0.80 + (分数-2) × 0.07)；后台：冷区固定、热区随分数扩大变亮
    深层占比 → 边缘晕开多少（表层清楚，深层融进背景）
    颗粒：幅度 0.2 → 0.8、速度 0.7 → 2.2，随分数线性变化
  答案从本机 localStorage 的 tw_answers_v2 读（{A1:{score,acting},…}）；没有就用右下角示例滑杆，或网址 ?s=2.8&d=0.4。
*/
import * as THREE from 'three';
import { FullScreenQuad } from 'three/addons/postprocessing/Pass.js';

// ───── 映射规则：照抄 20.2 score-mapping.js ─────
const clamp = (x, a, b) => Math.max(a, Math.min(b, x)), cl = x => clamp(x, 0, 1), lerp = (a, b, t) => a + (b - a) * t;
const rgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const samp = (cols, t) => { t = cl(t); const p = t * (cols.length - 1), k = Math.min(cols.length - 2, Math.floor(p)), f = p - k, a = rgb(cols[k]), b = rgb(cols[k + 1]); return a.map((v, i) => v + (b[i] - v) * f); };
const N = 41;
const RULE = { grain: { amount: [0.2, 0.8], speed: [0.7, 2.2] }, cuts: [4 / 3, 8 / 3], noAdjustDeep: 0, unsureDeep: 0.5 };
const STAGES = {
  front: { label: '前台色', bg: '#EB83B0', colors: ['#7A1035', '#8A143B', '#991842', '#A81C48', '#B8204E', '#C4294F', '#D13250', '#DE3A50', '#EA4351', '#F04D57', '#F5585E', '#FB6264', '#FC6A68', '#FD716C', '#FE7C73', '#FF8C7C', '#FF9C86', '#FFB29A', '#FFC8AE', '#FFD9C5', '#FFEBDC'] },
  mid: { label: '中台色', bg: '#696FE1', colors: ['#696FE1', '#7C6DC7', '#8F6BAD', '#A26893', '#B56679', '#C8645F', '#DB6245', '#EB6232', '#ED6B36', '#EF743A', '#F27E3D', '#F48741', '#F79045', '#F99949', '#FCA24D', '#FEAB50', '#FBB95B', '#F5CB69', '#EEDC78', '#E8EE87', '#E3FA91'] },
  back: { label: '后台色', bg: '#C1E1D4',
    cool: ['#C1E1D4', '#B9D6D8', '#B1CCDB', '#A9C1DE', '#A2B7E0', '#9AACE2', '#93A1E4', '#8D95E6', '#868AE7'],
    hot: ['#868AE7', '#929ADE', '#9FA9D4', '#ADB8CA', '#BBC6BD', '#CAD4AF', '#DAE19F', '#EAEE8B', '#FAFB71'], reach: [0.30, 0.475, 0.70, 0.88, 1.0] },
};
const formulaColors = (colors, s) => Array.from({ length: N }, (_, i) => samp(colors, cl(0.10 + Math.pow(i / (N - 1), 1.15) * 0.80 + (s - 2) * 0.07)));
function backColors(s) {
  const B = STAGES.back, u = clamp(s, 0, 4) / 4, sp = lerp(0.60, 0.40, u);
  const p = u * 4, k = Math.min(3, Math.floor(p)), reach = lerp(B.reach[k], B.reach[k + 1], p - k);
  return Array.from({ length: N }, (_, i) => {
    const v = i / (N - 1), c = samp(B.cool, v / sp), h = samp(B.hot, cl((v - sp) / (1 - sp)) * reach);
    const q = cl((v - (sp - 0.05)) / 0.1), sm = q * q * (3 - 2 * q);
    return c.map((x, j) => x + (h[j] - x) * sm);
  });
}
function overallPlan(s) {
  const [c1, c2] = RULE.cuts, e = 1e-9;
  if (s < c1 - e) return { id: 'back', colors: backColors(s) };
  if (s <= c2 + e) return { id: 'mid', colors: formulaColors(STAGES.mid.colors, s) };
  return { id: 'front', colors: formulaColors(STAGES.front.colors, s) };
}
const deepOf = (score, acting) => score == null ? null : score === 0 ? RULE.noAdjustDeep : acting === 'deep' ? 1 : acting === 'surface' ? 0 : RULE.unsureDeep;
const mean = a => { const v = a.filter(x => x != null); return v.length ? v.reduce((x, y) => x + y, 0) / v.length : null; };

// ───── 读数据 ─────
// 先看本机有没有自己刚答完的（tw_answers_v2）；再用问卷星 93 份真实答卷（data/答卷_去标识.json，只有编号、身份、九题）
const Q = new URLSearchParams(location.search);
const WHO = { STUDENT: 'STUDENT', EMPLOYED: 'EMPLOYED', OTHER: 'OTHER' };
const summarize = cells => { const v = Object.values(cells), s = mean(v.map(c => c.score));
  return s == null ? null : { s, d: mean(v.map(c => deepOf(c.score, c.acting))) ?? 0, n: v.filter(c => c.score != null).length }; };
let people = [];
try { people = await (await fetch('./data/答卷_去标识.json')).json(); } catch (e) {}
let mine = null;
const PROG = TW_progress();
if (PROG.complete) mine = summarize(PROG.a);
// 没答完不能看自己的温度（只有带 ?demo 的演示链接可以看样本里的人）
const LOCKED = !PROG.complete && !(Q.has('demo') && (Q.has('no') || Q.has('s')));
let idx = Math.max(0, people.findIndex(p => p.no === +(Q.get('no') || 63)));
let data, label;
function choose() {
  if (Q.has('s')) { data = { s: clamp(+Q.get('s'), 0, 4), d: cl(+(Q.get('d') ?? 0.3)), n: 9 }; label = '试看'; return; }
  if (mine && idx < 0) { data = mine; label = '你'; return; }
  const p = people[idx]; data = summarize(p.cells); label = `Subject NO.${p.no}<small>${WHO[p.who]}</small>`;
}
if (mine && !(Q.has('demo') && Q.has('no'))) idx = -1;   // 答完了就看自己的；演示链接才看样本里的人
choose();

// ───── 画布 ─────
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false });
const DPR = Math.min(devicePixelRatio || 1, 1.5); renderer.setPixelRatio(DPR);
const ramp = new THREE.DataTexture(new Uint8Array(N * 4), N, 1, THREE.RGBAFormat); ramp.magFilter = ramp.minFilter = THREE.LinearFilter;
const mkRT = (w, h) => new THREE.WebGLRenderTarget(w, h, { type: THREE.HalfFloatType, minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter });

// 来源：摄像头；没有摄像头就放一段真人演示视频（video/演示_真人_mixkit4815.mp4，Mixkit 免费素材；换别的视频直接改这一行）
const video = document.createElement('video'); video.muted = true; video.playsInline = true;
const demoVid = document.createElement('video'); demoVid.muted = true; demoVid.playsInline = true; demoVid.loop = true;
demoVid.src = './video/演示_两人咖啡馆_mixkit253.mp4';   // 两个人在咖啡馆里一起看电脑（换掉了单人长发正脸那段） demoVid.play().catch(() => {});
addEventListener('pointerdown', () => demoVid.play().catch(() => {}), { once: true });
let src = new THREE.VideoTexture(demoVid), usingCam = false;
function drawFake() {}
const note = {}, camBtn = { hidden: true, addEventListener() {} };
async function startCam() {
  try {
    const st = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480, facingMode: 'user' }, audio: false });
    video.srcObject = st; await video.play();
    src = new THREE.VideoTexture(video); usingCam = true; camBtn.hidden = true; note.textContent = '';
    passSmall.material.uniforms.uSrc.value = src;
  } catch (e) { camBtn.hidden = false; note.textContent = '没有摄像头：先放一段演示视频'; }
}

// 第一步：缩小到很小的图（自然就模糊了）。表层缩得少（边清楚），深层缩得多（边晕开）
const passSmall = new FullScreenQuad(new THREE.ShaderMaterial({
  uniforms: { uSrc: { value: src }, uAspect: { value: 1 }, uSrcAspect: { value: 4 / 3 }, uFoot: { value: new THREE.Vector2(0.01, 0.01) }, uMask: { value: null }, uHasMask: { value: 0 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.,1.); }`,
  fragmentShader: `uniform sampler2D uSrc, uMask; uniform float uAspect, uSrcAspect, uHasMask; uniform vec2 uFoot; varying vec2 vUv;
    void main(){ float acc = 0.0, msk = 0.0;
      for(int i=0;i<4;i++) for(int j=0;j<4;j++){                         // 一格里取 16 个点平均，把原画面的网点、噪点抹平
        vec2 uv = vUv + (vec2(float(i),float(j))/3.0-0.5)*uFoot; uv.x = 1.0-uv.x;   // 镜子
        float r = uAspect/uSrcAspect; if(r>1.0) uv.y = 0.5+(uv.y-0.5)/r; else uv.x = 0.5+(uv.x-0.5)*r;   // 铺满
        vec3 sc = texture2D(uSrc, uv).rgb; acc += max(sc.r, max(sc.g, sc.b));   // 照映射工具 20.4：取 r/g/b 里最亮的那个
        msk += uHasMask > 0.5 ? texture2D(uMask, vec2(uv.x, 1.0-uv.y)).r : 1.0; }   // 人像分割：人 = 1，背景 = 0
      gl_FragColor = vec4(acc/16.0, msk/16.0, 0.0, 1.0); }` }));
// 第二步：热的余温——动过的地方留一会儿热（Brik 的"动的地方更亮"）
const passHeat = new FullScreenQuad(new THREE.ShaderMaterial({
  uniforms: { uNow: { value: null }, uPrev: { value: null }, uDecay: { value: 0.86 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.,1.); }`,
  fragmentShader: `uniform sampler2D uNow, uPrev; uniform float uDecay; varying vec2 vUv;
    void main(){ float now = texture2D(uNow, vUv).r; vec2 p = texture2D(uPrev, vUv).rg;
      float m = smoothstep(0.01, 0.08, abs(now - p.g));
      gl_FragColor = vec4(max(p.r*uDecay, m), now, 0.0, 1.0); }` }));
// 第三步：上色 + 颗粒
const U = {
  uLum: { value: null }, uHeat: { value: null }, uRamp: { value: ramp }, uRes: { value: new THREE.Vector2() }, uT: { value: 0 },
  uGrain: { value: 0.5 }, uLo: { value: 0.09 }, uHi: { value: 0.95 }, uMid: { value: 1 }, uSpeed: { value: 1.4 }, uEdge: { value: 0.3 }, uOpen: { value: 0 }, uTiny: { value: null }, uTinyTexel: { value: new THREE.Vector2(1 / 32, 1 / 18) }, uTexel: { value: new THREE.Vector2() }, uMotion: { value: 0.35 },
};
const passColor = new FullScreenQuad(new THREE.ShaderMaterial({
  uniforms: U,
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.,1.); }`,
  fragmentShader: /* glsl */`
    uniform sampler2D uLum, uHeat, uRamp, uTiny; uniform vec2 uTinyTexel; uniform vec2 uRes, uTexel; uniform float uT, uGrain, uSpeed, uEdge, uMotion, uLo, uHi, uOpen, uMid;
    varying vec2 vUv;
    float h2(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
    float blur(sampler2D t, vec2 uv, float r){       // 9 点柔化，r 是格数
      float s = 0.0; float w = 0.0;
      for(int i=-1;i<=1;i++) for(int j=-1;j<=1;j++){ float k = (i==0&&j==0)?2.0:1.0; s += texture2D(t, uv+vec2(i,j)*uTexel*r).r*k; w += k; }
      return s/w; }
    vec2 bigBlur(vec2 uv, float r){                  // 没点进去时的大糊：两圈 16 个点，r 是格数
      vec2 s = texture2D(uTiny, uv).rg*2.0; float w = 2.0;      // 在一张很小的缩略图上糊，所以是整片色块
      for(int i=0;i<8;i++){ float a = float(i)*0.785398 + 0.39;
        vec2 d = vec2(cos(a), sin(a))*uTinyTexel;
        s += texture2D(uTiny, uv + d*r*0.5).rg*1.5 + texture2D(uTiny, uv + d*r).rg; w += 2.5; }
      return s/w; }
    void main(){
      float closed = 1.0 - uOpen;
      float lum = blur(uLum, vUv, 1.0 + uEdge*2.5);
      vec2 far = bigBlur(vUv, 1.6);
      float person = 0.0; float pw = 0.0;
      for(int i=-2;i<=2;i++) for(int j=-2;j<=2;j++){ person += texture2D(uLum, vUv+vec2(i,j)*uTexel*(0.8+uEdge*2.6)).g; pw += 1.0; }
      person = smoothstep(0.15, 0.85, person/pw);
      lum = mix(lum, far.r, closed); person = mix(person, smoothstep(0.05, 0.9, far.g), closed);   // 没点进去：人和背景都糊成一片
      float heat = blur(uHeat, vUv, 2.0 + uEdge*3.0);
      float v = pow(clamp((lum - uLo) / max(uHi - uLo, 0.02), 0.0, 1.0), 1.0 / uMid);   // 照映射工具：按这一帧自己的明暗拉满（1%–99%），再上色
      v = clamp(v + heat*uMotion*uOpen, 0.0, 1.0);     // 动的地方再热一点（点进去以后才有）
      v = mix(v*0.42, v, person);                      // 景还在，只是冷下去；人最热
      // 颗粒：分数越高越多、越快；颗粒抖的是"取哪一档颜色"，所以档与档之间是颗粒过渡
      float tt = floor(uT*20.0*uSpeed);
      float g = h2(floor(gl_FragCoord.xy/1.5) + tt*1.37) - 0.5;
      v = clamp(v + g*uGrain*0.22, 0.0, 1.0);
      vec3 col = texture2D(uRamp, vec2(v*(40.0/41.0)+0.5/41.0, 0.5)).rgb;
      col += (h2(gl_FragCoord.xy*0.71 + tt) - 0.5)*0.035*uGrain;
      gl_FragColor = vec4(col, 1.0);
    }` }));

let rtS, rtH = [null, null], hi = 0, scale = 6;
const rtTiny = mkRT(32, 18);

// ───── 识别：人脸框 + 人像分割 + 最热点（MediaPipe，本地跑，画面不上传）─────

  t.textContent = L('先用示例数据试一下', 'Try it with sample data'); t.href = `./热像镜子.html?demo&no=${pick}`;
} else if (mine && idx < 0) {
  mineNav.classList.add('on');
  document.getElementById('rv').textContent = L('回顾我的回答', 'Review my answers');
  document.getElementById('redo').textContent = L('重新答题', 'Answer again');
  document.getElementById('rvh').textContent = L('我的九个回答', 'My nine answers');
  const REL3 = { 1: L('导师或上级', 'Supervisor'), 2: L('同学或同事', 'Peer'), 3: L('很亲近的人', 'Someone close') };
  const EV3 = { A: L('改期', 'Postponed'), B: L('看作品', 'Their work'), C: L('好消息', 'Good news') };
  document.getElementById('rvl').innerHTML = TW_CELLS.map(c => { const m = PROG.a[c], w = TW_where(c);
    const dp = m.score == null ? '' : `&score=${m.score}&depth=${m.acting === 'deep' ? 1 : m.acting === 'unsure' ? 0.5 : 0}`;
    return `<li data-href="${w.page}?shot=${w.shot}${dp}&review"><span class="k">${REL3[c[1]]} · ${EV3[c[0]]}</span><span class="a">${m.ans || ''}${m.feel ? `<small>${m.feel}</small>` : ''}</span><span class="g">${m.score == null ? '—' : m.score + ' / 4'} →</span></li>`; }).join('');
  { const ol = document.getElementById('rvl'), cv = document.createElement('canvas'); cv.id = 'rvf'; ol.prepend(cv);
    const cx = cv.getContext('2d'), STN = ['front', 'mid', 'back'], rows = [...ol.querySelectorAll('li')];

}

// 映射工具的"人自身明暗拉满"：亮度 ≥ 6% 的像素取 1% / 99% 分位。镜子每 0.4 秒从缩小图上量一次，慢慢跟过去
