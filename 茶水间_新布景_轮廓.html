<script type="module">
import * as THREE from 'three';
import { FullScreenQuad } from 'three/addons/postprocessing/Pass.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

/* ---------- 问卷 v2.0 · 中台三题（演示按 A2 → B2 → C2 走；正式问卷的顺序是打散的） ---------- */
const ITEMS = [
  { shot: 'A', no: 'A2 · 中台', q: '你最后会怎么回应？',
    text: '你和一位同学（或同事）约好今天下午一起去做一件你挺看重的事，你为此空出了时间。快到时间时，对方来跟你说临时有事，要改到下周。你有点失望。',
    front: ['直接说：“啊，我还挺期待的，有点失望。”', '说“好吧，那下周吧”，语气里的失望也不特意收。', '平平地说“好，那改到下周”，不提失望。',
            '笑着说“没事没事，你先忙”，不让对方看出失望。', '反过来表现得很轻松：“正好我也能再准备准备，完全没关系！”'],
    back: ['还是有点失望', '已经没那么失望了', '说不清'] },
  { shot: 'B', no: 'B2 · 中台', q: '你最后会怎么说？',
    text: '一位同学（或同事）兴奋地给你看他刚做好的一个东西，问你觉得怎么样。你看了，觉得挺一般。',
    front: ['照实说：“嗯……我觉得还行，挺一般的。”', '先夸一两句，也说出自己觉得一般的地方。', '点点头说“嗯，我仔细看看”，不说好也不说不好。',
            '说“挺好的！”，不让对方看出你觉得一般。', '表现得很惊艳，一连夸好几句，让对方觉得你特别喜欢。'],
    back: ['还是觉得挺一般', '好像真觉得它还不错了', '说不清'] },
  { shot: 'C', no: 'C2 · 中台', q: '你最后会怎么说？',
    text: '你刚得知一件让你很开心的好消息。你碰到一位同学（或同事），看出他今天正为自己的事不顺心。他随口问你最近怎么样。',
    front: ['兴奋地把好消息说出来，开心也不收着。', '说出好消息，但收着点说，没那么兴奋。', '平平地提一句好消息，不显出开心。',
            '不提好消息，只说“还行吧”，不让对方看出你很开心。', '反过来跟着对方叹气，表现得自己最近也不怎么样。'],
    back: ['还是挺开心的', '开心好像真的淡下去了', '说不清'] },
];
// 英文版（她要求的英文问卷；Claude 照原题翻译，正式收数据前需要她审）
const ITEMS_EN = [
 {
  "no": "A2 · Peer",
  "q": "How do you finally respond?",
  "text": "You and a classmate (or colleague) planned to do something you care about together this afternoon, and you cleared your time for it. Shortly before, they tell you something has come up and they want to move it to next week. You feel a little let down.",
  "front": [
   "Say it plainly: “Oh, I was really looking forward to it — I’m a bit disappointed.”",
   "Say “Okay, next week then,” without hiding the disappointment in your voice.",
   "Say evenly, “Sure, let’s move it to next week,” and leave the disappointment out.",
   "Smile and say “No worries, go ahead,” so they can’t tell you’re disappointed.",
   "Act the opposite, all relaxed: “Perfect, that gives me more time to prepare — totally fine!”"
  ],
  "back": [
   "Still a little let down",
   "Not so let down anymore",
   "Hard to say"
  ]
 },
 {
  "no": "B2 · Peer",
  "q": "What do you finally say?",
  "text": "A classmate (or colleague) excitedly shows you something they have just made and asks what you think. You look at it and find it fairly ordinary.",
  "front": [
   "Say it honestly: “Hmm… it’s okay. Pretty ordinary, I think.”",
   "Praise a thing or two, and also mention what feels ordinary to you.",
   "Nod and say “Let me take a closer look,” saying neither good nor bad.",
   "Say “It’s great!” so they can’t tell you find it ordinary.",
   "Act amazed and pile on the praise, so they think you love it."
  ],
  "back": [
   "Still find it ordinary",
   "Starting to actually like it",
   "Hard to say"
  ]
 },
 {
  "no": "C2 · Peer",
  "q": "What do you finally say?",
  "text": "You have just heard some news that makes you really happy. You run into a classmate (or colleague) and can tell they are having a rough day over something of their own. They casually ask how you have been.",
  "front": [
   "Share the good news excitedly, without holding back your happiness.",
   "Share the good news, but toned down — not so excited.",
   "Mention the good news flatly, without showing you’re happy.",
   "Leave the good news out and just say “Not bad,” so they can’t tell you’re happy.",
   "Do the opposite and sigh along with them, as if things haven’t been great for you either."
  ],
  "back": [
   "Still happy",
   "The happiness has actually faded",
   "Hard to say"
  ]
 }
];
if (window.TW_LANG === 'en') ITEMS.forEach((it, i) => Object.assign(it, ITEMS_EN[i]));

/* ---------- 三个镜头（three 坐标 = Blender (x, z, -y)）：A 两只瓷杯，B 木盘上的胡萝卜蛋糕，C 挪到台边的一块蛋糕 ---------- */
const SHOTS = {
  A: { target: [0.2, 0.04, 0.05], polar: 50, az: 14, zoom: 1.0 },
  B: { target: [-0.66, 0.04, -0.01], polar: 50, az: 12, zoom: 1.0 },
  C: { target: [1.11, 0.04, 0.13], polar: 50, az: 16, zoom: 1.0 },
};
const H = 0.2;   // 画面半高（米）：很近，东西显得很大
for (const k in SHOTS) { try { const s = JSON.parse(localStorage.getItem('tw_cam_pantryline_' + k)); if (s) Object.assign(SHOTS[k], s); } catch (e) {} }

/* ---------- 物件温度（灰的时候只看这些；答完以后热键、痕迹才显出来） ---------- */
const HEAT = {"desk_top": 0.16, "wall": 0.1, "tablecloth": 0.13, "napkin": 0.16, "saucer": 0.3, "cup_mine": 0.34, "cup_theirs": 0.42, "spoon": 0.28, "tag": 0.24, "bottle": 0.34, "vase": 0.32, "roses": 0.3, "kettle": 0.32, "teapot": 0.32, "sugar": 0.3, "cake_board": 0.26, "cake": 0.36, "bowl": 0.3, "fruit": 0.32, "jam": 0.3, "glass": 0.3, "plate": 0.26, "slice": 0.36, "knife": 0.26, "plate_stack_b": 0.26, "cookie": 0.32, "sugar_cube": 0.26, "teabag": 0.22, "card": 0.2, "cake_box": 0.28, "ribbon": 0.24, "candle": 0.28, "crumb": 0.22, "sugar_pack": 0.2, "cup_dry": 0.28};
const WARM = {"cup_theirs": 0.6, "cake": 0.55, "slice": 0.55};   // 答完才热：那杯倒好了、一口没动的茶   // 只在热的时候加上去：你握过的那只杯子、同事带来的蛋糕、你挪开的那块蛋糕
const Q = new URLSearchParams(location.search), STILL = Q.has('still');
if (STILL) document.body.classList.add('still');

const renderer = new THREE.WebGLRenderer({ preserveDrawingBuffer: STILL });
renderer.setPixelRatio(STILL ? 1 : Math.min(devicePixelRatio, 2));
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.01, 50);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.enablePan = false; controls.maxPolarAngle = Math.PI * 0.49;
/* 看的人只能微微转：上下一共约 18°（±9°），左右一共约 56°（±28°），不能缩放。?edit 时放开，用来调镜头。 */
const EDIT = Q.has('edit'), LIM = { polar: 9, az: 28 }, D2R = THREE.MathUtils.degToRad;
controls.enableZoom = EDIT; if (!EDIT) document.getElementById('cam').hidden = true;
function limit(k) {
  if (EDIT) return;
  const s = SHOTS[k];
  controls.minPolarAngle = D2R(s.polar - LIM.polar); controls.maxPolarAngle = D2R(Math.min(88, s.polar + LIM.polar));
  controls.minAzimuthAngle = D2R(s.az - LIM.az); controls.maxAzimuthAngle = D2R(s.az + LIM.az);
}
function unlimit() { controls.minPolarAngle = 0; controls.maxPolarAngle = Math.PI * 0.49; controls.minAzimuthAngle = -Infinity; controls.maxAzimuthAngle = Infinity; }
const view = { target: new THREE.Vector3(), polar: 50, az: 0, zoom: 1 };
function applyView() {
  const p = THREE.MathUtils.degToRad(view.polar), a = THREE.MathUtils.degToRad(view.az), r = 6, t = view.target;
  camera.position.set(t.x + r * Math.sin(p) * Math.sin(a), t.y + r * Math.cos(p), t.z + r * Math.sin(p) * Math.cos(a));
  camera.zoom = view.zoom; camera.updateProjectionMatrix(); controls.target.copy(t); camera.lookAt(t); controls.update();
}
function readView() {   // 用户拖过以后，从相机读回角度
  const t = controls.target, v = camera.position.clone().sub(t), r = v.length();
  view.target.copy(t); view.polar = THREE.MathUtils.radToDeg(Math.acos(v.y / r)); view.az = THREE.MathUtils.radToDeg(Math.atan2(v.x, v.z)); view.zoom = camera.zoom;
}
const toShot = k => { const s = SHOTS[k]; view.target.set(...s.target); view.polar = s.polar; view.az = s.az; view.zoom = s.zoom; unlimit(); applyView(); limit(k); };

/* 物件：R = 温度（侧面稍热一点，像软泥的体积），G = 答完才显的热，A = 有东西 */
/* 焦点：镜头对着的地方最清楚，越远越淡，桌面化进白纸 */
const FOCUS = { value: new THREE.Vector3() }, TIME = { value: 0 };
/* 热源（2026-11-22）：每个镜头两三处 [x, y, z, 半径, 强度]——东西不是整个发亮，而是从这几处热起来 */
const SRC = [[0.16,0.07,0.12,0.04,1],[0.25,0.04,0.08,0.03,0.7],[0.3,0.03,0.0,0.05,0.4],[-0.77,0.09,0.06,0.05,1],[-0.65,0.03,0.1,0.04,0.6],[1.03,0.08,0.22,0.05,1],[1.17,0.03,0.1,0.05,0.45]];
const SRCU = { value: Array.from({ length: 8 }, (_, i) => new THREE.Vector4(...(SRC[i] || [0, -9, 0, 0.01]).slice(0, 4))) },
      SRCS = { value: Array.from({ length: 8 }, (_, i) => (SRC[i] || [0, 0, 0, 0, 0])[4]) };   // TIME：东西里面的颜色慢慢涌动
const objMat = (h, w, desk = false) => new THREE.ShaderMaterial({
  uniforms: { uHeat: { value: h }, uWarm: { value: w }, uFocus: FOCUS, uTime: TIME, uSrc: SRCU, uSrcS: SRCS, uDesk: { value: desk ? 1 : 0 } }, side: THREE.DoubleSide,
  vertexShader: 'varying vec3 vN, vW; void main(){ vN = normalize(normalMatrix * normal); vec4 w = modelMatrix * vec4(position, 1.0); vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }',
  fragmentShader: `uniform float uHeat, uWarm, uDesk, uTime; uniform vec3 uFocus; uniform vec4 uSrc[8]; uniform float uSrcS[8]; varying vec3 vN, vW;
    float hh(vec3 q){ return fract(sin(dot(q, vec3(127.1, 311.7, 74.7))) * 43758.5453); }
    float n3(vec3 p){ vec3 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
      return mix(mix(mix(hh(i), hh(i + vec3(1,0,0)), f.x), mix(hh(i + vec3(0,1,0)), hh(i + vec3(1,1,0)), f.x), f.y),
                 mix(mix(hh(i + vec3(0,0,1)), hh(i + vec3(1,0,1)), f.x), mix(hh(i + vec3(0,1,1)), hh(i + vec3(1,1,1)), f.x), f.y), f.z); }
    void main(){ float side = 1.0 - abs(normalize(vN).z);
      float d = length((vW - uFocus).xz);
      float k = uDesk > 0.5 ? exp(-d * d / 0.018) : mix(0.6, 1.0, exp(-d * d / 0.09));
      float flat_ = (uDesk > 0.5 || uHeat < 0.2) ? 1.0 : 0.0;   /* 桌面、墙、桌布、餐巾都当背景：不画 */   // 桌面、墙：不算轮廓，也不出温度（不然轮廓边上会多一圈深色）
      // 像 Daybreak 人身上的颜色：一团团在某处冒出来、胀开、再退下去（噪声的第三维是时间，所以是"冒"，不是"滑"）
      float T = uTime * 0.22;
      vec3 q = vec3(vW.x * 9.0 + vW.y * 4.0, vW.z * 9.0 - vW.y * 6.0, T);
      float pk = smoothstep(0.42, 0.85, n3(q)) * 0.75 + smoothstep(0.5, 0.9, n3(q * 1.9 + 7.3)) * 0.35;   // 大团 + 小团
      float m = n3(q * 0.6 + 3.1) * 2.0 - 1.0;
      float mot = (pk - 0.55) * 0.34 + m * 0.07 + min(vW.y, 0.12) * 0.5 + side * 0.06;
      // 结构：每个面按朝向落在色卡不同的位置（像 Daybreak 脸上的颧骨、鼻梁、下巴各有一块颜色）
      float lam = dot(normalize(vN), normalize(vec3(-0.45, 0.75, 0.5)));
      mot += lam * 0.28 - side * 0.06;
      if (uWarm <= 0.0) mot = min(mot, 0.0);   // 配角最多热一点点，不热过主角
      mot = flat_ > 0.5 ? 0.0 : mot;
      float src = 0.0;
      for (int i = 0; i < 8; i++) { vec3 dv = vW - uSrc[i].xyz; src += uSrcS[i] * exp(-dot(dv, dv) / (uSrc[i].w * uSrc[i].w)); }
      float rs = smoothstep(0.5, 0.88, n3(vW * 16.0 + 4.7)) * 0.55 + smoothstep(0.6, 0.92, n3(vW * 31.0 + 1.3)) * 0.25;
      src += rs * mix(0.35, 1.0, exp(-d * d / 0.06)) * (1.0 - flat_);   // 随机小热源：有轻重，但哪儿都有一点
      src = min(src, 1.2);
      gl_FragColor = vec4((uHeat * 0.62 + src * 0.7 + side * 0.09 + mot) * k * (1.0 - flat_), uWarm * k * (0.15 + 0.85 * min(src, 1.0)) * (0.85 + m * 0.3), 0.0, 1.0 - flat_); }`,
});
/* 痕迹：G = 答完显影，B = 转场时亮一下（uPulse） */
const tex = new THREE.TextureLoader(), traceTex = {}, traces = {};
const traceMat = name => {
  traceTex[name] ??= Object.assign(tex.load(`./models/traces/${name}.png`), { flipY: false, colorSpace: THREE.NoColorSpace });
  return new THREE.ShaderMaterial({
    uniforms: { map: { value: traceTex[name] }, uHeat: { value: 0.7 }, uPulse: { value: 0 } }, transparent: true, depthWrite: false, side: THREE.DoubleSide,
    polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2,
    blending: THREE.CustomBlending, blendEquation: THREE.AddEquation, blendSrc: THREE.OneFactor, blendDst: THREE.OneFactor,
    blendSrcAlpha: THREE.ZeroFactor, blendDstAlpha: THREE.OneFactor,
    vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
    fragmentShader: 'uniform sampler2D map; uniform float uHeat, uPulse; varying vec2 vUv; void main(){ float a = texture2D(map, vUv).a; gl_FragColor = vec4(0.0, uHeat * a, uPulse * a, 1.0); }',
  });

      setTimeout(() => { col.classList.remove('out'); heatSoon(); }, GLIDE.in - 300); };
    go2();
  } }
// （旧的换桌颜色过渡，已不用）
if (document.documentElement.classList.contains('veiled')) setTimeout(() => { document.documentElement.classList.remove('veiled'); $('veil').style.transition = 'opacity 1.4s cubic-bezier(.4,0,.2,1)'; try { sessionStorage.removeItem('tw_veil'); } catch (e) {} }, 450);   // 字体到了再画一次（打开时就有答过的选项）
if (REVIEW) {   // 回顾：把当时选的标出来，热痕照当时的分数；不能改
  next.classList.add('on'); next.textContent = L('回到我的温度', 'Back to my temperature'); next.onclick = () => { location.href = './热像镜子.html?open'; };
  prev.classList.remove('on');
  front.querySelectorAll('button').forEach(b => b.disabled = true); backOpts.querySelectorAll('button').forEach(b => b.disabled = true);
}
if (Q.has('score')) { const st = heatState(+Q.get('score'), Q.has('depth') ? +Q.get('depth') : 0.5); cur = st; setAB('A', st); setAB('B', st); }
window.__go = (s, dp = 0.5) => go(s < 0 ? GRAY : heatState(s, dp), 10);
window.__shot = k => toShot(k); window.__move = moveTo; window.__pulse = pulse; window.__next = () => step(1);

/* 编辑：每个镜头的角度可以拖了以后存下来 */
const curShot = () => camAnim ? null : ITEMS[idx].shot;
setInterval(() => { readView(); $('camTx').textContent = `镜头 ${curShot() ?? '…'} · 俯角 ${(90 - view.polar).toFixed(0)}° · 方位 ${view.az.toFixed(0)}° · 缩放 ${view.zoom.toFixed(2)}`; }, 250);
$('camSave').onclick = () => {
  const k = curShot(); if (!k) return; readView();
  const v = { target: view.target.toArray().map(x => +x.toFixed(3)), polar: +view.polar.toFixed(1), az: +view.az.toFixed(1), zoom: +view.zoom.toFixed(3) };
  SHOTS[k] = v; try { localStorage.setItem('tw_cam_pantryline_' + k, JSON.stringify(v)); } catch (e) {}
  console.log('TW_CAMERA pantry_set', k, JSON.stringify(v)); $('camOk').textContent = `镜头 ${k} 已存`;
};

renderer.setAnimationLoop(t => {
  const now = performance.now();
  if (spreadAnim) { const k = Math.min(1, (now - spreadAnim.t0) / spreadAnim.dur); FU.spread.value.z = ease(k) * spreadAnim.reach;
    if (k >= 1) { spreadAnim = null; FU.spread.value.z = 1e5; setAB('A', cur); } }
  if (pulseAnim) { const k = Math.min(1, (now - pulseAnim.t0) / pulseAnim.dur); pulseAnim.m.uniforms.uPulse.value = Math.sin(Math.PI * k) * 1.4;
    if (k >= 1) { pulseAnim.m.uniforms.uPulse.value = 0; pulseAnim = null; } }
  if (camAnim && now >= camAnim.t0) {
    const k = Math.min(1, (now - camAnim.t0) / camAnim.dur), e = camAnim.curve === 'in' ? k * k * k : camAnim.curve === 'out' ? 1 - Math.pow(1 - k, 3) : ease(k), f = camAnim.from, to = camAnim.to;   // 出去越飘越快，进来越飘越慢，接起来是一整段
    view.target.lerpVectors(f.target, to.target, e); view.polar = f.polar + (to.polar - f.polar) * e; view.az = f.az + (to.az - f.az) * e;
    view.zoom = (f.zoom + (to.zoom - f.zoom) * e) * (camAnim.glide ? 1 : 1 - 0.18 * Math.sin(Math.PI * e));   // 中途稍微拉远一点，像镜头退后再推进
    applyView(); if (k >= 1) { limit(camAnim.shot); camAnim = null; controls.enabled = true; }
  }
  FOCUS.value.copy(view.target); TIME.value = t / 1000;
  { const fp = view.target.clone().project(camera); FU.focus.value.set((fp.x * 0.5 + 0.5) * size.x, (fp.y * 0.5 + 0.5) * size.y); FU.focusR.value = size.y * 0.42; }
  FU.time.value = t / 1000;
  if (!camAnim) controls.update();
  renderer.setClearColor(0x000000, 0); renderer.setRenderTarget(rtS); renderer.clear(); renderer.render(scene, camera);
  blur(rtS, rtN, 4); blur(rtS, rtF, 40); blur(rtS, rtW, 150);   // A2 样张：近处模糊 8→4   // 弥散比第一版大（第一版 6 / 26 / 90）
  renderer.setRenderTarget(null); finalQuad.render(renderer); TW_topInk(renderer.getContext());
});
</script>
