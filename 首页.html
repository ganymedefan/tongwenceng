<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>In the Stratospheric Realm</title>
<link rel="icon" href="./favicon.svg"><link rel="stylesheet" href="./css/zh.css"><script src="./js/lang.js"></script><script src="./js/grd.js?v=1124"></script><script src="./js/progress.js"></script><script src="./js/heatTitle.js"></script>
<script type="importmap">{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }</script>
<!--
  首页：照她在 Variant 里做的第三版（2026-11-23 分享链接）——
  满屏颗粒渐变；竖着三栏，滑到哪一栏，那一栏变宽、正中浮出标题、底下浮出一句话；点 About 展开简介，点另外两栏进去。
  四块：About（情绪劳动）/ Data（九十三种温度）/ Survey（问卷）/ Interact（互动）。英文用 Exposure [-20]。
  颜色：三台色卡慢慢轮换；logo 跟着换。文字在 ZONES 里改。
-->
<style>
@font-face { font-family: "TWC Sans"; src: url("./fonts/noto-sans-sc-vf.woff2") format("woff2-variations"); font-weight: 100 900; font-display: swap; }
@font-face { font-family: "Exposure"; src: url("./fonts/Exposure-m20.otf") format("opentype"); font-display: swap; }
:root { --ink: #1b181d; --mute: rgba(27,24,29,.5); --pad: clamp(18px, 2.4vw, 34px); }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; background: #f3ece4; }
body { font-family: "Exposure", Georgia, serif; }
.lang-zh body { font-family: var(--zh); }
.lang-zh .col .ti { font-weight: 330; letter-spacing: .04em; }
.lang-zh .col .lb { font-weight: 330; letter-spacing: .1em; font-size: 14px; }
.lang-zh .langsw { font-weight: 330; letter-spacing: .06em; }
.lang-zh .col .ln { font-weight: 250; letter-spacing: .08em; line-height: 1.8; }
.langsw { position: fixed; right: var(--pad); top: var(--pad); z-index: 4; display: flex; gap: 12px; font-size: 13px; }
.langsw a { cursor: pointer; opacity: .45; } .langsw a.on { opacity: 1; }
body { color: var(--ink); -webkit-font-smoothing: antialiased; }
.col, .langsw { color: var(--ink); transition: color 1.2s ease; }
.col .lb i { color: var(--mute); transition: color 1.2s ease; }
a { color: inherit; text-decoration: none; }
canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }

.logo { position: fixed; left: var(--pad); top: calc(var(--pad) - 6px); z-index: 3; width: clamp(150px, 13vw, 210px); aspect-ratio: 561 / 284; pointer-events: none; }
.logo img { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; transition: opacity 1.6s ease; }
.logo img.on { opacity: 1; }
.logo:not(.ready) img { transition: none; }   /* 第一次出现不靠动画 */

/* 三栏 */
.cols { position: fixed; inset: 0; z-index: 2; display: flex; padding-top: clamp(130px, 19vh, 180px); }
.col { position: relative; flex: 1 1 0; min-width: 0; border-left: 1px solid rgba(27,24,29,.08); cursor: pointer; transition: flex-grow .9s cubic-bezier(.2,.75,.2,1); }
.col:first-child { border-left: 0; }
.col.on { flex-grow: 2.6; }
.col.open { flex-grow: 3.4; }
.col .lb { position: absolute; left: var(--pad); top: 0; font-size: 15px; letter-spacing: .02em; display: flex; gap: .6em; transition: opacity .5s; }
.col .lb i { font-style: normal; color: var(--mute); }
.cols.hov .col:not(.on) .lb { opacity: .45; }

.col .ti { position: absolute; left: var(--pad); right: var(--pad); top: 42%; transform: translateY(calc(-50% + 18px)); font-size: clamp(48px, 6.6vw, 118px); line-height: .9; letter-spacing: -.02em;
  opacity: 0; transition: opacity .5s, transform .9s cubic-bezier(.2,.75,.2,1); pointer-events: none; white-space: nowrap; }
.col.on .ti { opacity: 1; transform: translateY(-50%); transition-delay: .15s, 0s; }
.col .ti .tt { display: inline-block; position: relative; }
.col .ti .arr { color: var(--ink); display: inline-block; margin-left: .18em; opacity: 0; transform: translateX(-.25em); transition: opacity .45s, transform .6s cubic-bezier(.2,.75,.2,1); font-weight: 300; }
.col.armed .ti .arr { opacity: 1; transform: none; }

.col .ln { position: absolute; left: var(--pad); right: var(--pad); bottom: var(--pad); font-size: clamp(15px, 1.25vw, 19px); line-height: 1.35; max-width: 26em;
  opacity: 0; transform: translateY(10px); transition: opacity .5s, transform .8s cubic-bezier(.2,.75,.2,1); }
.col.on .ln { opacity: 1; transform: none; transition-delay: .25s, .1s; }
.col .ln b { font-weight: 400; display: inline-block; margin-top: .9em; border-bottom: 1px solid currentColor; }

/* About 点开后的一段 */
.col .more { position: absolute; left: var(--pad); right: var(--pad); top: calc(42% + clamp(48px, 6.6vw, 118px) * .75); max-width: 30em; font-size: clamp(15px, 1.2vw, 18px); line-height: 1.5;
  opacity: 0; transition: opacity .6s; pointer-events: none; }
.col.open .more { opacity: 1; transition-delay: .35s; }

@media (max-width: 760px) {
  .cols { flex-direction: column; padding-top: 110px; }
  .col { border-left: 0; border-top: 1px solid rgba(27,24,29,.08); }
  .col .lb { top: 12px; }
  .col .ti { top: 50%; font-size: 44px; }
  .col .ln { bottom: 12px; }
  .col .more { top: auto; bottom: 64px; font-size: 14px; }
}
@media (prefers-reduced-motion: reduce) { .col, .col .ti, .col .ln, .logo img { transition: none; } }
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="logo" id="logo">
  <img data-p="0" data-k="dark" src="./logo/logo_彩虹.png" alt="In the Stratospheric Realm">
  <img data-p="1" data-k="dark" src="./logo/logo_彩虹.png" alt="">
  <img data-p="2" data-k="dark" src="./logo/logo_彩虹.png" alt="">
  <img data-p="0" data-k="light" src="./logo/logo_彩虹_白字.png" alt="">
  <img data-p="1" data-k="light" src="./logo/logo_彩虹_白字.png" alt="">
  <img data-p="2" data-k="light" src="./logo/logo_彩虹_白字.png" alt="">
</div>
<div class="langsw"><a data-l="zh">中文</a><a data-l="en">English</a></div>
<main class="cols" id="cols"></main>

<script type="module">
import * as THREE from 'three';
import { FullScreenQuad } from 'three/addons/postprocessing/Pass.js';

// ───── 三块（改这里）─────
const ZONES = [
  { no: '01', name: L('关于', 'About'), line: L('情绪劳动，用温度看见。', 'Emotional labour, made visible as heat.'), go: L('读一读', 'Read'), href: './关于_情绪劳动.html' },
  { no: '02', name: L('数据', 'Data'), line: L('说出口的，和心里的，隔着多远。', 'How far what is said sits from what is felt.'), go: L('看看', 'Look'), href: './数据_九十三种温度.html' },
  { no: '03', name: L('问卷', 'Survey'), line: L('自己答这九道题。', 'Answer the nine yourself.'), go: L('开始', 'Begin'), href: './办公桌_新布景_轮廓.html' },
  { no: '04', name: L('互动', 'Interact'), line: L('看见你自己的温度。', 'See your own temperature.'), go: L('打开', 'Open'), href: './热像镜子.html' },
];
// 答题进度：没答完，互动不开；答到一半，问卷那一栏告诉你答到哪了
{ const P = TW_progress(), sv = ZONES[2], ia = ZONES[3];
  if (P.done > 0 && !P.complete) { const first = TW_CELLS.find(c => !P.a[c]), w = TW_where(first);
    sv.line = L(`已答 ${P.done} / 9`, `${P.done} of 9 answered`); sv.href = `${w.page}?shot=${w.shot}`; }
  if (P.complete) sv.line = L('九道题都答过了。', 'All nine answered.');
  if (!P.complete) { ia.line = L('答完九道题后开启', 'Opens after all nine'); ia.href = sv.href; } }
document.querySelectorAll('.langsw a').forEach(a => { a.classList.toggle('on', a.dataset.l === window.TW_LANG); a.onclick = () => setLang(a.dataset.l); });
const colsEl = document.getElementById('cols');
colsEl.innerHTML = ZONES.map(z => `<${z.href ? `a href="${z.href}"` : 'div'} class="col">
  <span class="lb"><i>${z.no}</i>${z.name}</span>
  <div class="ti"><span class="tt">${z.name}</span><span class="arr">→</span></div>
  ${z.more ? `<p class="more">${z.more}</p>` : ''}
  <p class="ln">${z.line}</p>
</${z.href ? 'a' : 'div'}>`).join('');
const cols = [...colsEl.children];
let cur = -1;
let armed = -1;
function on(i) { cur = i; if (armed !== i) armed = -1; colsEl.classList.toggle('hov', i >= 0); cols.forEach((c, j) => { c.classList.toggle('on', j === i); c.classList.toggle('armed', j === armed); }); }
cols.forEach((c, i) => {
  c.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') on(i); });
  c.addEventListener('click', e => {
    if (armed !== i) { e.preventDefault(); on(i); armed = i; c.classList.add('armed'); return; }   // 第一下：出箭头；第二下才跳
  });
});
colsEl.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') on(-1); });
const QS = new URLSearchParams(location.search);
if (QS.has('z')) { on(+QS.get('z') - 1); if (QS.has('open')) cols[cur].classList.add('open'); }   // 截图用

// ───── 背景：满屏颗粒渐变（像胶片），三台色卡慢慢轮换；滑到的那一栏轻轻热一点 ─────
const PALS = ['front', 'mid', 'back'];   // 她的三条 PS 渐变（js/grd.js）
const ramp = name => Array.from({ length: 9 }, (_, i) => { const c = TW_grdAt(name, i / 8); return new THREE.Color(c[0] / 255, c[1] / 255, c[2] / 255); });
const canvas = document.getElementById('bg');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false });
const DPR = Math.min(devicePixelRatio || 1, 1.5); renderer.setPixelRatio(DPR);
const U = { uRes: { value: new THREE.Vector2() }, uT: { value: 0 }, uC: { value: ramp(PALS[1]) }, uZone: { value: new THREE.Vector4(0, 0, 0, 0) }, uHov: { value: 0 } };
const quad = new FullScreenQuad(new THREE.ShaderMaterial({
  uniforms: U,
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.,1.); }`,
  fragmentShader: /* glsl */`
    uniform vec2 uRes; uniform vec4 uZone; uniform float uT, uHov; uniform vec3 uC[9]; varying vec2 vUv;
    float h2(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
    float n2(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);
      return mix(mix(h2(i),h2(i+vec2(1,0)),f.x),mix(h2(i+vec2(0,1)),h2(i+vec2(1,1)),f.x),f.y); }
    float fbm(vec2 p){ float s=0.0, a=0.5; mat2 r=mat2(0.8,0.6,-0.6,0.8); for(int i=0;i<4;i++){ s+=a*n2(p); p=r*p*2.02+1.7; a*=0.5; } return s/0.9375; }
    vec3 pick(float x){ x=clamp(x,0.0,1.0)*8.0; float i=floor(x), f=x-i; vec3 a=uC[0], b=uC[0];
      for(int k=0;k<9;k++){ if(float(k)==i) a=uC[k]; if(float(k)==min(i+1.0,8.0)) b=uC[k]; } return mix(a,b,f); }
    void main(){
      vec2 px = vUv*uRes; vec2 p = px/uRes.y*0.85; float t = uT*0.035;
      vec2 q = vec2(fbm(p*0.8+vec2(0.0,t)), fbm(p*0.8+vec2(4.3,1.7)-t*0.8));
      float v = smoothstep(0.22, 0.8, fbm(p*0.75 + 2.6*q + vec2(t*0.6,-t*0.3)));
      // 滑到的那一栏：轻轻热一点（边是软的）
      float x = vUv.x;
      float inZ = smoothstep(uZone.x-0.03, uZone.x+0.03, x) * (1.0 - smoothstep(uZone.y-0.03, uZone.y+0.03, x)) * uHov;
      v = clamp(pow(v, 0.85) + inZ*0.1, 0.0, 1.0);
      // 胶片颗粒：粗一点、密一点
      float tt = floor(uT*16.0);
      float g = h2(floor(px/1.2) + tt*7.31) - 0.5;
      vec3 col = pick(clamp(v + g*0.1, 0.0, 1.0));
      col += (h2(px*0.73 + tt) - 0.5) * 0.09;
      float sat = max(col.r, max(col.g, col.b)) - min(col.r, min(col.g, col.b));
      col = mix(col, vec3(1.0), smoothstep(0.22, 0.62, sat) * 0.42);    // 越浓越往白里提：去掉浓色团
      col = mix(col, vec3(dot(col, vec3(0.3,0.59,0.11))), 0.08);
      gl_FragColor = vec4(col, 1.0);
    }`,
  depthTest: false, depthWrite: false }));
function resize() { renderer.setSize(innerWidth, innerHeight, false); U.uRes.value.set(innerWidth * DPR, innerHeight * DPR); }
addEventListener('resize', resize); resize();

const logos = [...document.querySelectorAll('#logo img')];
let target = +(QS.get('p') || 2) - 1, held = performance.now(), logoInk = 'dark';
logos.forEach(l => l.classList.toggle('on', +l.dataset.p === 0 && l.dataset.k === logoInk));
if (QS.has('p')) U.uC.value = ramp(PALS[target]);
const clock = new THREE.Clock(); let last = 0, lastRead = -1;
// 字色：深底用白，浅底用黑（中间留一段不动，免得来回闪）
const gl = renderer.getContext(), px = new Uint8Array(4);
const INK = { dark: ['#1b181d', 'rgba(27,24,29,.5)'], light: ['#ffffff', 'rgba(255,255,255,.66)'] };
function lumAt(x, y) { gl.readPixels(Math.round(x * DPR), Math.round((innerHeight - y) * DPR), 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px); return (0.3 * px[0] + 0.59 * px[1] + 0.11 * px[2]) / 255; }
function lumRect(r) { let s = 0, n = 0; for (let a = 0.15; a < 1; a += 0.35) for (let b = 0.1; b < 1; b += 0.2) { s += lumAt(r.left + r.width * a, r.top + r.height * b); n++; } return s / n; }
const inkState = new Map();
function pick(el, L) { const prev = inkState.get(el) || 'dark'; const k = L < 0.44 ? 'light' : L > 0.52 ? 'dark' : prev; inkState.set(el, k); el.style.setProperty('--ink', INK[k][0]); el.style.setProperty('--mute', INK[k][1]); return k; }
const logoBox = document.getElementById('logo'), langEl = document.querySelector('.langsw');
function readInks() {
  cols.forEach(c => pick(c, lumRect(c.getBoundingClientRect())));
  pick(langEl, lumRect(langEl.getBoundingClientRect()));
  logoInk = pick(logoBox, lumRect(logoBox.getBoundingClientRect()));
  logos.forEach(l => l.classList.toggle('on', +l.dataset.p === 0 && l.dataset.k === logoInk));
}
function frame() {
  const t = clock.getElapsedTime(), dt = Math.min(0.05, t - last); last = t;
  if (!QS.has('p') && performance.now() - held > 14000) { held = performance.now(); target = (target + 1) % 3; logos.forEach(l => l.classList.toggle('on', +l.dataset.p === 0 && l.dataset.k === logoInk)); }
  const g = ramp(PALS[target]); U.uC.value.forEach((c, i) => c.lerp(g[i], Math.min(1, dt * 0.5)));
  if (cur >= 0) { const r = cols[cur].getBoundingClientRect(); U.uZone.value.set(r.left / innerWidth, r.right / innerWidth, 0, 0); }
  U.uHov.value += ((cur < 0 ? 0 : 1) - U.uHov.value) * Math.min(1, dt * 2);
  if (fxStage !== target) { fxStage = target; titleFx.forEach(f => f.setStage(PALS[target])); }
  U.uT.value = t;
  quad.render(renderer);
  if (t - lastRead > 0.4) { lastRead = t; readInks(); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
requestAnimationFrame(() => requestAnimationFrame(() => document.getElementById('logo').classList.add('ready')));
// 浮出的大标题：字的热弥散（全站只在这里用一次），颜色跟着当前色卡
const titleFx = [];
Promise.all(cols.map((c, i) => heatTitle(c.querySelector('.tt'), PALS[target], { text: ZONES[i].name }))).then(a => titleFx.push(...a.filter(Boolean)));
let fxStage = target;
</script>
</body>
</html>
